      try {
        if (!localStorage.getItem('lifepilot-auth-migration-v1')) {
          Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k));
          localStorage.setItem('lifepilot-auth-migration-v1', '1');
        }
      } catch (_) {}
    </script>
