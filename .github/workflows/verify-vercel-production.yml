name: Verify Vercel Production Deployment

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read

jobs:
  verify-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            statuses="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/commits/${SHA}/statuses")"

            vercel_state="$(printf '%s' "$statuses" | jq -r '[.[] | select(.context == "Vercel")] | .[0].state // "pending"')"
            vercel_url="$(printf '%s' "$statuses" | jq -r '[.[] | select(.context == "Vercel")] | .[0].target_url // ""')"

            echo "Vercel status: ${vercel_state} ${vercel_url}"

            case "$vercel_state" in
              success)
                exit 0
                ;;
              failure|error)
                echo "Vercel reported ${vercel_state}."
                exit 1
                ;;
            esac

            sleep 20
          done

          echo "Timed out waiting for the Vercel GitHub deployment status."
          exit 1
