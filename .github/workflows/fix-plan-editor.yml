name: Patch plan editor
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Plan component
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('LifePilot/src/lifepilot-v2.jsx')
          s=p.read_text()
          start=s.index('function Plan(')
          end=s.index('function Goals(', start)
          new=r'''function Plan({goals,tasks,uid,reload}){const [goalId,setGoalId]=useState(goals[0]?.id||''),[goalTitle,setGoalTitle]=useState(goals[0]?.title||''),[generating,setGenerating]=useState(false),[days,setDays]=useState('30'),[minutes,setMinutes]=useState('20'),[error,setError]=useState('');useEffect(()=>{const g=goals.find(x=>x.id===goalId);if(g)setGoalTitle(g.title||'')},[goalId,goals]);const goal=goals.find(g=>g.id===goalId);const mine=tasks.filter(t=>t.goal_id===goalId&&t.task_date>=today()).slice(0,10);const cleanNumber=v=>v===''?'':String(v).replace(/\D/g,'').replace(/^0+(?=\d)/,'');const generate=async()=>{const title=goalTitle.trim();const d=Number(days),m=Number(minutes);if(!goal)return setError('Crea prima un obiettivo.');if(!title)return setError('Scrivi l’obiettivo del piano.');if(!Number.isInteger(d)||d<1||d>365)return setError('La durata deve essere tra 1 e 365 giorni.');if(!Number.isInteger(m)||m<5||m>240)return setError('I minuti devono essere tra 5 e 240.');setGenerating(true);setError('');try{if(title!==goal.title){const {error:e}=await supabase.from('goals').update({title}).eq('id',goal.id).eq('user_id',uid);if(e)throw e}const {data,error}=await supabase.functions.invoke('generate-plan',{body:{title,category:goal.category,days:d,dailyMinutes:m}});if(error){let detail=error.message||'Errore della Edge Function.';try{if(error.context){const r=await error.context.json();if(r?.error)detail=r.error}}catch{}throw Error(detail)}const items=Array.isArray(data?.plan)?data.plan:[];if(!items.length)throw Error(data?.error||'Il piano generato è vuoto.');const start=new Date();const rows=items.map((x,i)=>{const dt=new Date(start);dt.setDate(dt.getDate()+Math.max(0,Number(x.day||i+1)-1));return {goal_id:goal.id,user_id:uid,task_date:dt.toISOString().slice(0,10),title:String(x.title||`Azione ${i+1}`).trim(),priority:2}});if(rows.length){const {error:e}=await supabase.from('goal_tasks').delete().eq('goal_id',goal.id).eq('user_id',uid);if(e)throw e;const {error:e2}=await supabase.from('goal_tasks').insert(rows);if(e2)throw e2}const {error:goalError}=await supabase.from('goals').update({days:d,daily_minutes:m,plan:items}).eq('id',goal.id).eq('user_id',uid);if(goalError)throw goalError;await reload()}catch(e){setError(e.message||'Impossibile generare il piano.')}finally{setGenerating(false)}};if(!goals.length)return <div className="page"><Header title="Il mio piano" subtitle="Trasforma un obiettivo in azioni concrete."/><Empty title="Prima creiamo un obiettivo" text="Il piano parte da una destinazione chiara. Crea il tuo primo obiettivo e poi torniamo qui per costruire il percorso." action="Crea obiettivo" onClick={()=>{window.dispatchEvent(new CustomEvent('lifepilot:navigate',{detail:'goals'}))}}/></div>;return <div className="page"><Header title="Il mio piano" subtitle="Scrivi cosa vuoi raggiungere e lascia a LifePilot il compito di trasformarlo in azioni."/><Panel><div className="form-grid"><label className="plan-goal-field">Cosa vuoi raggiungere?<input value={goalTitle} onChange={e=>setGoalTitle(e.target.value)} placeholder="Es. trovare un nuovo lavoro"/></label><label>Durata (giorni)<input type="number" inputMode="numeric" min="1" max="365" value={days} onChange={e=>setDays(cleanNumber(e.target.value))} placeholder="30"/></label><label>Minuti al giorno<input type="number" inputMode="numeric" min="5" max="240" value={minutes} onChange={e=>setMinutes(cleanNumber(e.target.value))} placeholder="20"/></label></div>{goals.length>1&&<label>Obiettivo salvato<select value={goalId} onChange={e=>setGoalId(e.target.value)}>{goals.map(g=><option value={g.id} key={g.id}>{g.title}</option>)}</select></label>}{error&&<div className="msg error">{error}</div>}<button className="primary" disabled={!goal||generating} onClick={generate}>{generating?'Generazione…':'Genera'}</button></Panel><Panel><div className="panel-head"><h2>Prossimi passi</h2><span className="pill">{mine.length} task</span></div>{mine.length?mine.map(t=><TaskRow task={t} key={t.id}/>):<p className="muted">Genera il piano per creare automaticamente i task.</p>}</Panel></div>}
'''
          p.write_text(s[:start]+new+s[end:])
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LifePilot/src/lifepilot-v2.jsx
          git diff --cached --quiet || git commit -m "fix: editable plan inputs and generation button"
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-plan-editor.yml || true
          git commit -m "chore: remove temporary patch workflow" || true
          git push || true
